<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hikâyemiz">
<meta name="theme-color" content="#faf7f2">
<title>Burak ve Duygu’nun Sonsuz Hikâyesi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2625;--mute:#8a807c;--accent:#9c3d54;--line:#e8e0d8;--ok:#dff1e3;--no:#f8dcdc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1617;--card:#251e20;--ink:#f1e9e5;--mute:#a89a98;--accent:#e08aa1;--line:#3a2f32;--ok:#24402c;--no:#4a2a2a}}
:root[data-theme="dark"]{--bg:#1b1617;--card:#251e20;--ink:#f1e9e5;--mute:#a89a98;--accent:#e08aa1;--line:#3a2f32;--ok:#24402c;--no:#4a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-weight:300}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
#login{position:fixed;inset:0;background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;z-index:30}
.lbox{background:var(--card);border:1px solid var(--line);padding:38px 28px;border-radius:20px;text-align:center;width:90%;max-width:340px}
.lbox h2{font-family:'Playfair Display',serif;font-weight:500;font-size:26px}
.lbox p{font-size:13px;color:var(--mute);margin:8px 0 22px}
#pw{font-size:22px;text-align:center;letter-spacing:8px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;font-weight:500;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.lbox .btn{width:100%}
#err{color:#c0392b;font-size:12px;margin-top:10px;display:none}
#app{display:none;min-height:100vh;flex-direction:column}
header{background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--line);padding:14px 12px 12px;text-align:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-family:'Playfair Display',serif;font-size:21px;font-weight:500;cursor:pointer}
nav{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:transparent;border:1px solid var(--line);padding:7px 14px;border-radius:20px;font-size:13px;white-space:nowrap}
nav button:first-child{margin-left:auto}nav button:last-child{margin-right:auto}
nav button.on,aside button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wrap{display:flex;flex:1;align-items:flex-start}
aside{width:78px;flex:none;position:sticky;top:122px;max-height:calc(100vh - 230px);overflow-y:auto;margin:24px 0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px;scrollbar-width:thin}
aside button{flex:none;background:transparent;border:1px solid var(--line);padding:7px 2px;border-radius:9px;font-family:'Playfair Display',serif;font-size:14px}
main{flex:1;padding:24px 16px 150px;max-width:900px;margin:0 auto;min-width:0}
h2{font-family:'Playfair Display',serif;font-weight:500;font-size:26px;margin-bottom:16px}
h3{font-family:'Playfair Display',serif;font-weight:500;margin:22px 0 10px}
.hero{text-align:center;padding:48px 8px}
.hero .big{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(34px,9vw,60px);min-height:1.3em;font-weight:400}
.hero p{font-size:17px;margin-top:16px;line-height:1.7;color:var(--mute);opacity:0;transition:opacity 1.2s}
.hero .h{font-size:30px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;position:relative}
.card b{display:block;margin-bottom:3px;font-weight:500;padding-right:22px}.card small{color:var(--mute)}.card p{white-space:pre-wrap;margin-top:6px;line-height:1.6}
.card .x{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--mute);font-size:18px}
.card a{color:var(--accent);font-size:13px}
.play{margin-top:8px;background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px}
.form{margin:14px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:24px;height:24px}
.empty{color:var(--mute);text-align:center;padding:14px;font-size:14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.opt.ok{background:var(--ok)}.opt.no{background:var(--no)}
#counter{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;z-index:6}
#counter small{display:block;font-size:10px;color:var(--mute);margin-bottom:3px}
#counter div{display:flex;gap:8px;font-family:'Playfair Display',serif;font-size:16px}
#counter span i{display:block;font-style:normal;font-size:9px;color:var(--mute);font-family:'Plus Jakarta Sans',sans-serif}
#pl{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;z-index:7;display:none;max-width:236px}
#pl div{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;gap:8px}
#pl iframe{display:block;border:0;border-radius:8px;width:220px;height:124px}
#pl audio{width:220px;display:block}
#lb,#ss{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20}
#lb img,#ss img{max-width:96%;max-height:84%;border-radius:8px}
#ss{flex-direction:column;gap:12px;color:#fff;z-index:21}
#ss .c{display:flex;gap:10px;align-items:center}
#ss button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:20px;padding:9px 16px;font-size:15px}
.hr{position:fixed;top:-40px;z-index:25;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(25deg)}}
@media(max-width:560px){aside{width:60px;margin-left:4px;padding:6px 4px}aside button{font-size:12px}#pl{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}

/* Canlı arka plan: sadece transform/opacity animasyonu, hafif */
:root{--b1:rgba(214,120,140,.20);--b2:rgba(245,200,160,.28);--b3:rgba(190,150,210,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:rgba(224,138,161,.14);--b2:rgba(150,90,110,.20);--b3:rgba(120,90,160,.14)}}
:root[data-theme="dark"]{--b1:rgba(224,138,161,.14);--b2:rgba(150,90,110,.20);--b3:rgba(120,90,160,.14)}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg.off{display:none}#bg.paused *{animation-play-state:paused}
.bl{position:absolute;width:70vmax;height:70vmax;border-radius:50%;will-change:transform}
.bl.a{left:-20vmax;top:-20vmax;background:radial-gradient(circle,var(--b1),transparent 65%);animation:d1 38s ease-in-out infinite alternate}
.bl.b{right:-25vmax;top:8vh;background:radial-gradient(circle,var(--b2),transparent 65%);animation:d2 46s ease-in-out infinite alternate}
.bl.c{left:5vw;bottom:-35vmax;background:radial-gradient(circle,var(--b3),transparent 65%);animation:d3 42s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(28vmax,18vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-26vmax,22vmax) scale(.9)}}
@keyframes d3{to{transform:translate(24vmax,-20vmax) scale(1.2)}}
.fh{position:absolute;bottom:-40px;opacity:0;will-change:transform;animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:.3}90%{opacity:.25}100%{transform:translate3d(var(--dx,20px),-115vh,0) rotate(20deg);opacity:0}}
.wrap{position:relative;z-index:1}
#fx{position:absolute;right:10px;top:10px;background:none;border:0;font-size:18px;opacity:.7}
@media (prefers-reduced-motion:reduce){#bg *{animation:none!important}.fh{display:none}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="bg"><div class="bl a"></div><div class="bl b"></div><div class="bl c"></div></div>
<div id="login"><div class="lbox"><h2>Burak &amp; Duygu</h2><p>Bu hikâye sadece ikimize özel 🖤🤍</p>
<input id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
<button class="btn" onclick="unlock()">Gir</button><div id="err">Şifre yanlış, tekrar dene</div></div></div>

<div id="app">
<header><button id="fx" onclick="fxToggle()" title="Arka plan animasyonunu aç/kapat">✨</button><h1 onclick="go('home')">Burak ve Duygu’nun Sonsuz Hikâyesi</h1><nav id="nav"></nav></header>
<div class="wrap"><aside id="side"></aside><main><div id="bar"></div><div id="view"></div><div class="grid" id="sgrid"></div></main></div>
<div id="counter"><small>29 Eylül 2021’den beri</small><div id="cnt"></div></div>
</div>
<div id="pl"></div>
<div id="lb" onclick="this.style.display='none'"><img id="lbi" alt=""></div>
<div id="ss"><img id="ssi" alt=""><div class="c"><button onclick="ssPrev()">‹</button><span id="ssn"></span><button onclick="ssNext()">›</button><button id="ssp" onclick="ssAuto()">⏸</button><button onclick="ssClose()">✕</button></div></div>

<script>
var YEARS=[];for(var y=2021;y<=2050;y++)YEARS.push(y);
/* FOTOĞRAFLAR: her yıl için kaç fotoğraf yüklediğini yaz. Dosyalar foto/2021/1.jpg, 2.jpg ... şeklinde olmalı */
var FOTO={2021:4,2022:4,2023:1,2024:2,2025:5,2026:4};
/* GİRİŞ: arka plan resmi ve karşılama şarkısı (dosya yoksa sessizce atlanır; kapatmak için '' yaz) */
var GIRIS_FOTO='giris/arkaplan.jpg';
var KARSILAMA='giris/karsilama.mp3';
var SEC={
 sarki:{t:'Şarkılarımız',f:[['a','Şarkı adı'],['b','Sanatçı'],['l','YouTube linki ya da mp3 dosya adı (örn. sarki1.mp3)'],['c','Bizim için anlamı','area']]},
 sozluk:{t:'Mini Sözlüğümüz',f:[['a','Kelime'],['c','Anlamı / hikâyesi','area']]},
 gezi:{t:'Gezeceğimiz ve Gezdiğimiz Yerler',f:[['a','Yer'],['b','Durum','sel'],['c','Not / anı','area']]},
 gunluk:{t:'Günlüğümüz',f:[['a','Başlık'],['d','Tarih','date'],['c','Bugün neler oldu?','area']]},
 harita:{t:'Haritamız',f:[['a','Yer / adres'],['c','Bu yer bizim için neden özel?','area']]},
 quiz:{t:'Beni Ne Kadar Tanıyorsun?',f:[]}
};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var CLOUD='Bağlanıyor…',DB=null,AS=null,PH=null,CACHE={},MIG={},cur='home',HD=0;
function lsGet(k){var n=k.replace('bd_','');if(CACHE[n])return CACHE[n];try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function lsSet(k,v){var n=k.replace('bd_','');CACHE[n]=v;if(DB){DB.doc('sec_'+n).set({items:v}).catch(function(){})}else{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}

function unlock(){if($('pw').value==='2909'){$('login').style.display='none';$('app').style.display='flex';build();go('home');if(KARSILAMA)playLink('Hoş geldin 🖤',KARSILAMA,1)}else{$('err').style.display='block';$('pw').value=''}}
if(GIRIS_FOTO){var _bi=new Image();_bi.onload=function(){$('login').style.backgroundImage='linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url('+GIRIS_FOTO+')'};_bi.src=GIRIS_FOTO}
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});

function build(){
 $('nav').innerHTML=Object.keys(SEC).map(function(k){return '<button data-k="'+k+'" onclick="go(\''+k+'\')">'+SEC[k].t+'</button>'}).join('');
 $('side').innerHTML=YEARS.map(function(y){return '<button data-k="y'+y+'" onclick="go(\'y'+y+'\')">'+y+'</button>'}).join('');
 tick();setInterval(tick,1000);initCloud();mkIcon();mkBg()}
function go(k){cur=k;QZ={};
 document.querySelectorAll('[data-k]').forEach(function(b){b.classList.toggle('on',b.dataset.k===k)});
 var isY=k[0]==='y'&&!SEC[k];
 $('bar').innerHTML=isY?'<button class="btn ghost" onclick="openShow('+k.slice(1)+')">▶ Slayt gösterisi</button>':'';
 if(k==='home')home();else if(isY)year(+k.slice(1));else if(k==='quiz')quiz();else sect(k);
 statPhotos(k);window.scrollTo(0,0)}

function home(){
 $('view').innerHTML='<div class="hero"><div class="big" id="tw"></div><p id="hs">Doğum günün kutlu olsun,<br>nice beraber geçireceğimiz yıllara…</p><div class="h">🖤🤍</div></div>';
 var t='Hoşgeldin Bebeğim';if(HD){$('tw').textContent=t;$('hs').style.opacity=1;return}HD=1;
 var i=0,iv=setInterval(function(){var e=$('tw');if(!e){clearInterval(iv);return}e.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(iv);$('hs').style.opacity=1}},80);hearts()}
function hearts(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 for(var i=0;i<18;i++){var s=document.createElement('span');s.className='hr';s.textContent=i%2?'🖤':'🤍';s.style.left=Math.random()*96+'%';s.style.fontSize=(14+Math.random()*16)+'px';s.style.animationDuration=(4+Math.random()*3)+'s';s.style.animationDelay=(Math.random()*2)+'s';document.body.appendChild(s);(function(e){setTimeout(function(){e.remove()},9500)})(s)}}

function sect(k){var s=SEC[k],items=lsGet('bd_'+k);
 var form=s.f.map(function(f){
  if(f[2]==='area')return '<textarea id="f'+f[0]+'" rows="3" placeholder="'+f[1]+'"></textarea>';
  if(f[2]==='sel')return '<select id="f'+f[0]+'"><option>Gezdik</option><option>Gezeceğiz</option></select>';
  if(f[2]==='date')return '<input id="f'+f[0]+'" type="date">';
  return '<input id="f'+f[0]+'" placeholder="'+f[1]+'">'}).join('');
 var list=items.length?items.map(function(it,i){
  var sub=[it.b,it.d].filter(Boolean).map(esc).join(' · ');
  var extra=k==='harita'?'<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.a)+'">Haritada aç →</a>':'';
  if(k==='sarki'&&it.l)extra='<button class="play" onclick="play('+i+')">▶ Çal</button>';
  return '<div class="card"><button class="x" onclick="del(\''+k+'\','+i+')">×</button><b>'+esc(it.a)+'</b>'+(sub?'<small>'+sub+'</small>':'')+(it.c?'<p>'+esc(it.c)+'</p>':'')+extra+'</div>'}).reverse().join(''):'<div class="empty">Henüz bir şey yok, ilkini sen ekle 🖤</div>';
 $('view').innerHTML='<h2>'+s.t+'</h2><div class="form">'+form+'<button class="btn" onclick="add(\''+k+'\')">Ekle</button></div>'+list}
function add(k){var o={};SEC[k].f.forEach(function(f){o[f[0]]=$('f'+f[0]).value.trim()});
 if(!o.a)return;var a=lsGet('bd_'+k).slice();a.push(o);lsSet('bd_'+k,a);sect(k)}
function del(k,i){if(!confirm('Silinsin mi?'))return;var a=lsGet('bd_'+k).slice();a.splice(i,1);lsSet('bd_'+k,a);k==='quiz'?quiz():sect(k)}

/* Müzik */
function play(i){var it=lsGet('bd_sarki')[i];if(it&&it.l)playLink(it.a,it.l)}
function playLink(t,l,q){l=l.trim();var m=l.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/),p=$('pl'),h;
 if(m){h='<iframe src="https://www.youtube.com/embed/'+m[1]+'?autoplay=1&playsinline=1" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media" allowfullscreen></iframe><a target="_blank" rel="noopener" style="font-size:12px;color:var(--accent);display:block;margin-top:6px" href="https://www.youtube.com/watch?v='+m[1]+'">YouTube’da aç ↗</a>';
  if(location.protocol==='file:')h+='<div style="font-size:11px;color:var(--mute);margin-top:4px">Dosya olarak açıldığında oynatıcı çalışmayabilir, yayınlanan sitede çalışır.</div>'}
 else if(/^https?:/.test(l)&&!/\.(mp3|m4a|wav|ogg)(\?|$)/i.test(l))h='<a target="_blank" rel="noopener" style="color:var(--accent)" href="'+esc(l)+'">Bağlantıyı aç ↗</a>';
 else{var src=/^https?:/.test(l)?l:(l.indexOf('/')>-1?l:'muzik/'+l);h='<audio controls autoplay '+(q?'onerror="plClose()" ':'')+'src="'+esc(src)+'"></audio>'}
 p.innerHTML='<div><span>🎵 '+esc(t)+'</span><button class="x" style="background:none;border:0;font-size:16px" onclick="plClose()">×</button></div>'+h;p.style.display='block'}
function plClose(){$('pl').innerHTML='';$('pl').style.display='none'}

/* Test */
var QZ={};
function quiz(){var q=lsGet('bd_quiz');
 $('view').innerHTML='<h2>Beni Ne Kadar Tanıyorsun?</h2>'+(q.length?'<button class="btn" onclick="qStart()">▶ Teste başla ('+q.length+' soru)</button>':'<div class="empty">Önce aşağıdan sorular ekle 🖤</div>')+
 '<h3>Soru ekle</h3><div class="form"><textarea id="qq" rows="2" placeholder="Soru"></textarea><input id="qa0" placeholder="A şıkkı"><input id="qa1" placeholder="B şıkkı"><input id="qa2" placeholder="C şıkkı"><input id="qa3" placeholder="D şıkkı"><select id="qr"><option value="0">Doğru cevap: A</option><option value="1">Doğru cevap: B</option><option value="2">Doğru cevap: C</option><option value="3">Doğru cevap: D</option></select><button class="btn" onclick="qAdd()">Soruyu ekle</button></div>'+
 q.map(function(x,i){return '<div class="card"><button class="x" onclick="del(\'quiz\','+i+')">×</button><b>'+esc(x.q)+'</b><small>Doğru: '+esc(x.o[x.r])+'</small></div>'}).join('')}
function qAdd(){var q=$('qq').value.trim(),o=[0,1,2,3].map(function(i){return $('qa'+i).value.trim()}),r=+$('qr').value;if(!q||!o[r]||o.filter(Boolean).length<2)return;
 var a=lsGet('bd_quiz').slice();a.push({q:q,o:o,r:r});lsSet('bd_quiz',a);quiz()}
function qStart(){QZ={i:0,s:0,l:lsGet('bd_quiz').slice()};qShow()}
function qShow(){var l=QZ.l;if(QZ.i>=l.length){var p=QZ.s/l.length,m=p===1?'Beni gerçekten çok iyi tanıyorsun 🖤':p>=.6?'Harikasın, neredeyse hepsini bildin 🤍':'Biraz daha birlikte vakit geçirmemiz lazım 🙂';
  $('view').innerHTML='<div class="hero"><div class="big">'+QZ.s+' / '+l.length+'</div><p style="opacity:1">'+m+'</p><div style="margin-top:20px"><button class="btn" onclick="qStart()">Tekrar dene</button> <button class="btn ghost" onclick="quiz()">Geri</button></div></div>';return}
 var x=l[QZ.i];$('view').innerHTML='<small style="color:var(--mute)">Soru '+(QZ.i+1)+' / '+l.length+'</small><h2 style="margin-top:6px">'+esc(x.q)+'</h2>'+x.o.map(function(t,j){return t?'<button class="opt" id="o'+j+'" onclick="qPick('+j+')">'+'ABCD'[j]+') '+esc(t)+'</button>':''}).join('')+'<div id="nx"></div>'}
function qPick(j){var x=QZ.l[QZ.i];if(QZ.done)return;QZ.done=1;if(j===x.r)QZ.s++;
 [0,1,2,3].forEach(function(n){var e=$('o'+n);if(e){e.disabled=true;if(n===x.r)e.classList.add('ok');else if(n===j)e.classList.add('no')}});
 $('nx').innerHTML='<button class="btn" onclick="QZ.i++;QZ.done=0;qShow()">'+(QZ.i+1>=QZ.l.length?'Sonucu gör':'Sonraki →')+'</button>'}

/* Fotoğraflar */
